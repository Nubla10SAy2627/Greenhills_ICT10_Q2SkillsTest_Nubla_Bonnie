<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Information Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Non-metal Elements</h1>
        <p>Periodic Table Information Finder</p>

    <div>
        <h3>Instructions</h3>
        <p>Enter the <b>symbol</b> of a non-metal element (Example: H, O, Cl, Ne, Xe)</p>

        <div>
            <label for="symbol" class="form-label"><b>Element Symbol</b><br></label>
            <input type="text" id="symbol" class="form-control" placeholder="e.g. H, He, C, N, O">
        </div>

        <input type="button" py-click="check_details" value="Check Details">

        <div id="display"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
